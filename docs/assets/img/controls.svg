<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f9ff"/><stop offset="1" stop-color="#e3edff"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67a0ff"/><stop offset="1" stop-color="#3978f6"/></linearGradient>
  <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8bff"/><stop offset="1" stop-color="#1f55d6"/></linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fe0a8"/><stop offset="1" stop-color="#1fae74"/></linearGradient>
  <linearGradient id="grape" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b79cf5"/><stop offset="1" stop-color="#8259e0"/></linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc85c"/><stop offset="1" stop-color="#f59a1b"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2f55a0" flood-opacity=".18"/></filter>
  <filter id="sh2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2f55a0" flood-opacity=".16"/></filter>
</defs>
<rect width="960" height="720" fill="url(#bg)"/>
<circle cx="800" cy="120" r="230" fill="#d5e4ff" opacity=".7"/>
<circle cx="120" cy="640" r="190" fill="#d9f5e6" opacity=".7"/>
<circle cx="880" cy="640" r="90" fill="#ece4ff" opacity=".8"/>
<rect x="190" y="70" width="580" height="580" rx="28" fill="#fff" filter="url(#sh)" /><text x="230" y="128" font-size="26" font-weight="700" fill="#0d1729" text-anchor="start">Advanced settings</text><text x="230" y="156" font-size="15" font-weight="500" fill="#8a97a9" text-anchor="start">Pin a setting to keep it on the main view</text><rect x="222" y="190" width="516" height="72" rx="18" fill="#f6f9fe"/><circle cx="264" cy="226" r="20" fill="url(#blue)"/><text x="300" y="222" font-size="19" font-weight="700" fill="#0d1729" text-anchor="start">Pause while typing</text><rect x="300" y="236" width="170" height="9" rx="4.5" fill="#dde6f4"/><path d="M618 214l14 14m-4 -18l8 8l-10 4l-6 -6z" fill="#3978f6" stroke="#3978f6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="660" y="209" width="62" height="34" rx="17" fill="url(#blue)"/><circle cx="705" cy="226" r="12" fill="#fff"/><rect x="222" y="276" width="516" height="72" rx="18" fill="#f6f9fe"/><circle cx="264" cy="312" r="20" fill="url(#grape)"/><text x="300" y="308" font-size="19" font-weight="700" fill="#0d1729" text-anchor="start">Pause when you scroll</text><rect x="300" y="322" width="170" height="9" rx="4.5" fill="#dde6f4"/><path d="M618 300l14 14m-4 -18l8 8l-10 4l-6 -6z" fill="#3978f6" stroke="#3978f6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="660" y="295" width="62" height="34" rx="17" fill="url(#blue)"/><circle cx="705" cy="312" r="12" fill="#fff"/><rect x="222" y="362" width="516" height="72" rx="18" fill="#f6f9fe"/><circle cx="264" cy="398" r="20" fill="url(#mint)"/><text x="300" y="394" font-size="19" font-weight="700" fill="#0d1729" text-anchor="start">Keep scroll position</text><rect x="300" y="408" width="170" height="9" rx="4.5" fill="#dde6f4"/><path d="M618 386l14 14m-4 -18l8 8l-10 4l-6 -6z" fill="none" stroke="#a9b6ca" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="660" y="381" width="62" height="34" rx="17" fill="#d5ddeb"/><circle cx="677" cy="398" r="12" fill="#fff"/><rect x="222" y="448" width="516" height="72" rx="18" fill="#f6f9fe"/><circle cx="264" cy="484" r="20" fill="url(#sun)"/><text x="300" y="480" font-size="19" font-weight="700" fill="#0d1729" text-anchor="start">Hard reload</text><rect x="300" y="494" width="170" height="9" rx="4.5" fill="#dde6f4"/><path d="M618 472l14 14m-4 -18l8 8l-10 4l-6 -6z" fill="none" stroke="#a9b6ca" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="660" y="467" width="62" height="34" rx="17" fill="#d5ddeb"/><circle cx="677" cy="484" r="12" fill="#fff"/><rect x="222" y="534" width="516" height="72" rx="18" fill="#f6f9fe"/><circle cx="264" cy="570" r="20" fill="url(#blue)"/><text x="300" y="566" font-size="19" font-weight="700" fill="#0d1729" text-anchor="start">Notify on match</text><rect x="300" y="580" width="170" height="9" rx="4.5" fill="#dde6f4"/><path d="M618 558l14 14m-4 -18l8 8l-10 4l-6 -6z" fill="none" stroke="#a9b6ca" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="660" y="553" width="62" height="34" rx="17" fill="url(#blue)"/><circle cx="705" cy="570" r="12" fill="#fff"/>
</svg>
