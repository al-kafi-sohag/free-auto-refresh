# The website now lives at https://freeautorefresh.com (Cloudflare builds it from this
# repository; see wrangler.jsonc). GitHub Pages only keeps the old address working: this
# publishes one small redirect page per page of the site, pointing at the new address.
# Runs on every push to main, so new pages get a redirect too.
name: Redirect old website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site/make-redirects.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _old-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
